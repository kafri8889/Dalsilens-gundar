<svg viewBox="0 0 480 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="11">

  <rect width="480" height="600" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
    <marker id="arrl" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#444"/>
    </marker>
  </defs>

  <!-- START -->
  <circle cx="240" cy="30" r="14" fill="#222"/>

  <!-- Arrow: Start to Act1 -->
  <line x1="240" y1="44" x2="240" y2="58" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ACT 1: Frame Bitmap Diperbarui -->
  <rect x="110" y="60" width="260" height="36" rx="18" fill="white" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="84" text-anchor="middle" fill="#222">Frame Bitmap Diperbarui</text>

  <!-- Arrow to Decision 1 -->
  <line x1="240" y1="96" x2="240" y2="117" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DECISION 1: Filter Aktif? -->
  <polygon points="240,117 288,145 240,173 192,145" fill="white" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="149" text-anchor="middle" fill="#222">Filter Aktif?</text>

  <!-- Ya: down -->
  <line x1="240" y1="173" x2="240" y2="197" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="246" y="189" font-size="10" fill="#666">Ya</text>

  <!-- Tidak: right to box then far-right line to End -->
  <line x1="288" y1="145" x2="313" y2="145" stroke="#444" stroke-width="1.5"/>
  <text x="297" y="139" font-size="10" fill="#666">Tidak</text>
  <rect x="313" y="125" width="124" height="40" rx="8" fill="white" stroke="#444" stroke-width="1.5"/>
  <text x="375" y="141" text-anchor="middle" fill="#222" font-size="10">Tampilkan</text>
  <text x="375" y="156" text-anchor="middle" fill="#222" font-size="10">Bitmap Asli</text>
  <line x1="437" y1="145" x2="457" y2="145" stroke="#444" stroke-width="1.5"/>
  <line x1="457" y1="145" x2="457" y2="565" stroke="#444" stroke-width="1.5"/>
  <line x1="457" y1="565" x2="257" y2="565" stroke="#444" stroke-width="1.5" marker-end="url(#arrl)"/>

  <!-- DECISION 2: Daltonisasi Aktif? -->
  <polygon points="240,217 288,245 240,273 192,245" fill="white" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="249" text-anchor="middle" fill="#222">Daltonisasi Aktif?</text>

  <!-- Ya: left to getDaltonizationMatrix -->
  <line x1="192" y1="245" x2="168" y2="245" stroke="#444" stroke-width="1.5" marker-end="url(#arrl)"/>
  <text x="177" y="239" font-size="10" fill="#666">Ya</text>
  <rect x="28" y="225" width="140" height="40" rx="8" fill="#eef4ff" stroke="#444" stroke-width="1.5"/>
  <text x="98" y="241" text-anchor="middle" fill="#222" font-size="10">getDaltonization</text>
  <text x="98" y="256" text-anchor="middle" fill="#222" font-size="10">Matrix(type, severity)</text>
  <!-- Left box to merge -->
  <line x1="98" y1="265" x2="98" y2="338" stroke="#444" stroke-width="1.5"/>
  <line x1="98" y1="338" x2="234" y2="338" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tidak: right to getDeficiencyMatrix -->
  <line x1="288" y1="245" x2="300" y2="245" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="292" y="239" font-size="10" fill="#666">Tidak</text>
  <rect x="300" y="225" width="140" height="40" rx="8" fill="white" stroke="#444" stroke-width="1.5"/>
  <text x="370" y="241" text-anchor="middle" fill="#222" font-size="10">getDeficiency</text>
  <text x="370" y="256" text-anchor="middle" fill="#222" font-size="10">Matrix(type, severity)</text>
  <!-- Right box to merge -->
  <line x1="370" y1="265" x2="370" y2="338" stroke="#444" stroke-width="1.5"/>
  <line x1="370" y1="338" x2="246" y2="338" stroke="#444" stroke-width="1.5" marker-end="url(#arrl)"/>

  <!-- Merge node -->
  <circle cx="240" cy="340" r="4" fill="#444"/>

  <!-- Arrow to Bangun Matriks -->
  <line x1="240" y1="344" x2="240" y2="367" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ACT: Bangun Matriks 4x5 -->
  <rect x="110" y="369" width="260" height="36" rx="18" fill="white" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="393" text-anchor="middle" fill="#222">Bangun Matriks 4x5 (FloatArray[20])</text>

  <!-- Arrow -->
  <line x1="240" y1="405" x2="240" y2="425" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ACT: Terapkan ColorMatrix -->
  <rect x="80" y="427" width="320" height="42" rx="18" fill="white" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="444" text-anchor="middle" fill="#222">Terapkan ColorFilter.colorMatrix</text>
  <text x="240" y="460" text-anchor="middle" fill="#222" font-size="10">(GPU-accelerated, via Jetpack Compose)</text>

  <!-- Arrow -->
  <line x1="240" y1="469" x2="240" y2="489" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ACT: Tampilkan Hasil -->
  <rect x="110" y="491" width="260" height="36" rx="18" fill="#eef4ff" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="515" text-anchor="middle" fill="#222">Tampilkan Hasil di Layar</text>

  <!-- Arrow to End -->
  <line x1="240" y1="527" x2="240" y2="549" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="240" cy="565" r="16" fill="none" stroke="#444" stroke-width="2"/>
  <circle cx="240" cy="565" r="10" fill="#222"/>

</svg>
